[textdomain]
    name="wesnoth-merfolk_campaign"
    path="data/add-ons/Merfolk_Campaign/translations"
[/textdomain]

[campaign]
    #textdomain wesnoth-merfolk_campaign

    name= _ "Merfolk Campaign" 
    abbrev= _ "MC"
    id=MERFOLK_CAMPAIGN_ID
    define=MERFOLK_CAMPAIGN
    year="630 YW"

    icon="data/add-ons/Merfolk_Campaign/images/units/merfolk/siren-kai-magic-2.png~RC(magenta>lightblue)"
    image="portraits/merfolk/initiate.webp"
	background="story/landscape-mountains-05.webp"
    description= _ "Elivaras' merfolk campaign project"

    {CAMPAIGN_DIFFICULTY EASY   "data/add-ons/merfolk_campaign/images/units/merfolk/initiate-princess.png~RC(magenta>lightblue)" ( _ "Princess") ( _ "Beginner")}
    {CAMPAIGN_DIFFICULTY NORMAL "data/add-ons/merfolk_campaign/images/units/merfolk/enchantress-queen.png~RC(magenta>lightblue)" ( _ "Queen") ( _ "Normal")} {DEFAULT_DIFFICULTY}
    {CAMPAIGN_DIFFICULTY HARD   "data/add-ons/merfolk_campaign/images/units/merfolk/siren-kai.png~RC(magenta>lightblue)" ( _ "Kai") ( _ "Challenging")}

    first_scenario=01_a_patrol_gone_awry
	
    [load_resource]
        id=merfolk_ability_events
    [/load_resource]
[/campaign]

#ifdef MERFOLK_CAMPAIGN

[binary_path]
    path=data/add-ons/Merfolk_Campaign
[/binary_path]


{~add-ons/Merfolk_Campaign/utils}
{~add-ons/Merfolk_Campaign/images}
{~add-ons/Merfolk_Campaign/maps}

{~add-ons/Merfolk_Campaign/scenarios}

    ## # Load lua files, Code by Lord-Knightmare
    [lua]
        code = <<
			wesnoth.dofile("~add-ons/Merfolk_Campaign/lua/nearest_unit.lua")
        >>
    [/lua]
[+units]
    {~add-ons/Merfolk_Campaign/units}
[/units]

[binary_path]
    path=data/campaigns/Winds_of_Fate
[/binary_path]

	{campaigns/Winds_of_Fate/utils}

[+units]
    {campaigns/Winds_of_Fate/units}
[/units]

[binary_path]
    path=data/campaigns/Dead_Water
[/binary_path]

[units]
    {campaigns/Dead_Water/units}
[/units]

[binary_path]
    path=data/campaigns/Heir_To_The_Throne
[/binary_path]

{campaigns/Heir_To_The_Throne/utils}

[units]
    {campaigns/Heir_To_The_Throne/units}
[/units]
#endif

