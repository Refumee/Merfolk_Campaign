#textdomain wesnoth-utbs

#define INTERNAL:ABILITY_SUPER_HEAL_NO_NOTES
    [heals]
        value=12
        id=healing
        affect_allies=yes
        name= _ "heals +12"
        female_name= _ "female^heals +12"
        description= _ "This unit combines herbal remedies with magic to heal units more quickly than is normally possible on the battlefield.

A unit cared for by this healer may heal up to 12 HP per turn, or stop poison from taking effect for that turn.
A poisoned unit cannot be cured of its poison by a healer, and must seek the care of a village or a unit that can cure."
        affect_self=no
        poison=slowed
        [affect_adjacent]
        [/affect_adjacent]
    [/heals]
#enddef

#define ABILITY_SUPER_HEAL
    {INTERNAL:ABILITY_SUPER_HEAL_NO_NOTES}
    [+heals]
        special_note=_"This unit is capable of basic healing and slowing dehydration."
    [/heals]
#enddef

#define NOTE_CURES
    [+heals]
        special_note=_"This unit is capable of healing those around it and curing them of poison."
    [/heals]
#enddef

#define ABILITY_SUPER_CURES
    {INTERNAL:ABILITY_UNPOISON_NO_NOTES}
    {INTERNAL:ABILITY_SUPER_HEAL_NO_NOTES}
    {NOTE_CURES}
#enddef

#define UTBS_TAILWIND_EVENTS
    [event]
        name=turn refresh
        first_time_only=no
        id=tailwind

        [store_unit]
            [filter]
                ability=tailwind
                [filter_side]
                    [allied_with]
                        side=$side_number
                    [/allied_with]
                [/filter_side]
                [and]
                    # filter_wml is slow, which is why there's already an ability=tailwind filter before this
                    [filter_wml]
                        [abilities]
                            [tailwind]
                                id=tailwind
                                value=2
                            [/tailwind]
                        [/abilities]
                    [/filter_wml]
                [/and]
            [/filter]
            variable=utbs_tailwind2_sources
        [/store_unit]

        [modify_unit]
            [filter]
                side=$side_number
                [filter_adjacent]
                    find_in=utbs_tailwind2_sources
                [/filter_adjacent]
            [/filter]
            [object]
                duration=turn end
                [effect]
                    apply_to=movement
                    increase=2
                [/effect]
            [/object]
            moves="$($this_unit.moves + 2)"
        [/modify_unit]

        {CLEAR_VARIABLE utbs_tailwind2_sources}
    [/event]
#enddef

# This is the Teaching ability owned by SupportingCharacter2
#define ABILITY_TEACHING
    [dummy]
        id=teaching
        name= _ "teaching"
        female_name= _ "female^teaching"
        description= _ "At the start of every turn, this unit redistributes its experience points to all mermaid units of the same side adjacent to it. If no suitable unit is adjacent, its experience just goes back to zero."
    [/dummy]
#enddef

# Event for the teaching ability
#define ABILITY_TEACHING_EVENT
    [event]
        name=turn refresh,victory
        id=SupportingCharacter2
        first_time_only=no

        [lua]
            # wmllint: markcheck off
            code=<<
                local _ = wesnoth.textdomain "wesnoth-utbs"

                local teachers = wesnoth.get_units { ability = "teaching", side = wesnoth.current.side }

                for i, teacher in ipairs(teachers) do
                    local students = wesnoth.get_units { side = wesnoth.current.side, type = { "Mermaid Initiate", "Mermaid Enchantress", "Mermaid Siren", "Initiate Queen", "Enchantress Queen", "Siren Queen" }, { "filter_adjacent", { id = teacher.id } } }

                    if #students > 0 then -- don't divide by zero
                        wesnoth.scroll_to_tile(teacher.x, teacher.y)

                        local function cf(u1, u2)
                            -- criteria: the unit with lower level comes first
                            -- if level is equal, the unit with less experience comes first
                            if u1.level < u2.level then return true end
                            if u1.level > u2.level then return false end
                            if u1.experience < u2.experience then return true end
                            return false
                        end

                        table.sort(students, cf)

                        -- now we need to divide SupportingCharacter2's xp between all the units
                        -- we can't just round the result of the division, because this will mean
                        -- either not redistributing all the XP points, or generating them out of thin air
                        -- so we perform both a division and a modulo
                        -- # (length) has a higher precedence than *, / and %
                        local div = math.floor(teacher.experience / #students)
                        local mod = teacher.experience % #students

                        for j, student in ipairs(students) do
                            -- the modulo operation is used to redistribute every remaining XP
                            -- so at the start of each turn SupportingCharacter2 goes back to 0 XP
                            -- concrete example: we have 9 XP and 4 units
                            -- the first unit will receive 3 XP, while the other units 2
                            local xp_to_add = div
                            if j <= mod then
                                xp_to_add = xp_to_add + 1
                            end

                            -- having a message that tells you that the unit gained 0 XP is simply obnoxious
                            if xp_to_add > 0 then
                                student.experience = student.experience + xp_to_add
                                -- performance-wise, string concatenation is slower than string interpolation
                                -- but it's way more readable than two nested interpolations...
                                wesnoth.float_label(student.x, student.y, "<span color='cyan'>" .. tostring(_ "+%d XP"):format(xp_to_add) .. "</span>")
                                if student.experience >= student.max_experience then
                                    -- advance unit, animate and fire events
                                    wesnoth.advance_unit(student, true, true)
                                end
                            end
                        end
                    end

                    -- in case that SupportingCharacter2 has no "students", his experience goes wasted instead of being redistributed...
                    teacher.experience = 0
                end
            >>
            # wmllint: markcheck off
        [/lua]
    [/event]
#enddef

#define ABILITY_TEACHING_MERFOLK
    [dummy]
        id=teaching_saurian
        name= _ "naia's chant"
        female_name= _ "female^naia's chant"
        description= _ "At the start of every turn, this unit grants 3 experience points to all the units of the same side adjacent to it."
    [/dummy]# wmlxgettext: [abilities]
#enddef	

#define ABILITY_TEACHING_MERFOLK_EVENT
	#event for giving XP to neighbouring units
	[event]
		name=turn refresh
		id=teaching_saurian_event1
		first_time_only=no
		
		[filter_side]
			[has_unit]
				side=$side_number
				ability=teaching_saurian
			[/has_unit]
		[/filter_side]
			
		[scroll_to_unit]
			[filter]
				side=$side_number
				ability=teaching_saurian
				is_enemy=false
			[/filter]
		[/scroll_to_unit]
		
		[sound]
			name=hiss.wav
		[/sound]
		
		[item]
			[filter]
				[filter_adjacent]
					side=$side_number
					ability=teaching_saurian
					is_enemy=false
				[/filter_adjacent]
			[/filter]
			halo="halo/saurian-magic-halo-[1~7].png:60"
		[/item]
		[delay]
			time=420
		[/delay]
		[remove_item]
			[filter]
				[filter_adjacent]
					side=$side_number
					ability=teaching_saurian
					is_enemy=false
				[/filter_adjacent]
			[/filter]
		[/remove_item]
		
		[modify_unit]
			[filter]
				[filter_adjacent]
					side=$side_number
					ability=teaching_saurian
					is_enemy=false
				[/filter_adjacent]
			[/filter]
		  experience="$($this_unit.experience + 3)"
		[/modify_unit]
	[/event]
#enddef

#define WEAPON_SPECIAL_COLD
    [damage_type]
        id=cold_damage
        name= _ "cold"
        description= _ "This attack combines the cold type with the type of weapon used so that resistance to the cold type does not penalize the user."
        special_note=_ "This unit can use the cold type when the opponent is particularly sensitive to it in relation to the weapon on which it is applied."
        alternative_type=cold
    [/damage_type]
#enddef

[resource]
    id=merfolk_ability_events
	{UTBS_TAILWIND_EVENTS}
	{ABILITY_TEACHING_EVENT}
	{ABILITY_TEACHING_MERFOLK_EVENT}
[/resource]