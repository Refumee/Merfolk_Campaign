    advances_to=null
    cost=19
    usage=mixed fighter
    description={DANIELLE_DESCRIPTION}
    die_sound=mermaid-die.ogg
    {DEFENSE_ANIM "units/merfolk/initiate-princess-defend-2.png" "units/merfolk/initiate-princess-defend-1.png" mermaid-hit.ogg }
